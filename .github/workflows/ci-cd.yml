name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TCR_REGISTRY: hkccr.ccs.tencentyun.com
  TCR_NAMESPACE: gdgeek

jobs:
  # ==========================================
  # 步骤1: 测试
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build -- --mode production 2>&1 | head -50 || true

      - name: Lint (if available)
        run: npm run lint --if-present

      - name: Run tests (if available)
        run: npm test --if-present

  # ==========================================
  # 步骤2: 构建并部署（矩阵策略，两个品牌并行）
  # ==========================================
  deploy:
    name: Deploy ${{ matrix.brand }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - brand: xingkou
            image_name: xingkou
            target_domain: https://d.ar-creator.cn
          - brand: xiading
            image_name: xiading
            target_domain: https://xiading.hxgxonline.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ matrix.image_name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_TARGET_DOMAIN=${{ matrix.target_domain }}
          cache-from: type=gha,scope=${{ matrix.brand }}
          cache-to: type=gha,mode=max,scope=${{ matrix.brand }}

      - name: Deploy notification
        run: |
          echo "✅ ${{ matrix.brand }} 部署成功!"
          echo "镜像: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ matrix.image_name }}"
