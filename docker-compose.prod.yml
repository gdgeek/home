version: "3"

services:
    wordpress:
        depends_on:
            - db
        image: wordpress:latest
        restart: always
        environment:
            - WORDPRESS_DB_HOST=db:3306
            - WORDPRESS_DB_USER=wordpress
            - WORDPRESS_DB_PASSWORD=w0rdp2ess
            - WORDPRESS_DB_NAME=wordpress
        volumes:
            - blog-data:/var/www/html
        networks:
            - proxy
            - default
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.blog_hxgxonline_com-secure.entrypoints=websecure"
            - "traefik.http.routers.blog_hxgxonline_com-secure.rule=Host(`blog.hxgxonline.com`)"
            - "traefik.http.routers.blog_hxgxonline_com-secure.middlewares=test-compress@file"

    db:
        image: mysql:8.0
        restart: always
        volumes:
            - sql-data:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=Setup2021
            - MYSQL_DATABASE=wordpress
            - MYSQL_USER=wordpress
            - MYSQL_PASSWORD=w0rdp2ess
        networks:
            - default

volumes:
    sql-data:
    blog-data:

networks:
    proxy:
        external: true
    default:
        driver: bridge
