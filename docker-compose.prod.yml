version: "3"

services:
    frontend:
        image: hkccr.ccs.tencentyun.com/gdgeek/home:latest
        ports:
            - "80:80"
        environment:
            - BRAND=xiading
        restart: always

    wordpress:
        depends_on:
            - db
        image: wordpress:latest
        ports:
            - "8080:80"
        environment:
            - WORDPRESS_DB_HOST=db:3306
            - WORDPRESS_DB_USER=wordpress
            - WORDPRESS_DB_PASSWORD=w0rdp2ess
            - WORDPRESS_DB_NAME=wordpress
        volumes:
            - blog-data:/var/www/html
        restart: always

    db:
        image: mysql:8.0
        volumes:
            - sql-data:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=Setup2021
            - MYSQL_DATABASE=wordpress
            - MYSQL_USER=wordpress
            - MYSQL_PASSWORD=w0rdp2ess
        restart: always

volumes:
    sql-data:
    blog-data:
