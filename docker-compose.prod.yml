version: "3.8"

# 生产环境
# 默认根据访问域名选择品牌；如需锁定单品牌，可显式设置 BRAND_ID。

services:
  frontend:
    image: ccr.ccs.tencentyun.com/${TCR_NAMESPACE:-gdgeek}/ar-home:main
    ports:
      - "80:80"
    environment:
      - APP_API_1_URL=https://api.xrteeth.com
      - APP_API_2_URL=https://api.tmrpp.com
      - APP_AUTH_1_URL=https://identity.xrteeth.com
    restart: unless-stopped

  wordpress:
    image: wordpress:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: w0rdp2ess
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - blog-data:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    volumes:
      - sql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: Setup2021
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: w0rdp2ess
    restart: unless-stopped

volumes:
  sql-data:
  blog-data:
