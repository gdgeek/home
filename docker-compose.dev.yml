version: "3.8"

# 开发环境
# 通过 BRAND_ID 环境变量指定品牌：xingkou | xiading

services:
  frontend:
    build:
      context: .
      args:
        VITE_WORDPRESS_API_URL: http://wordpress:80/wp-json/wp/v2
        VITE_BACKEND_API_URL: http://localhost:3000/api
    ports:
      - "80:80"
    environment:
      - BRAND_ID=xiading
    depends_on:
      - wordpress
    networks:
      - dev-network

  wordpress:
    image: wordpress:latest
    ports:
      - "8080:80"
    volumes:
      - ./wordpress/wp-content:/var/www/html/wp-content:rw
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_password
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dev-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql:rw
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
