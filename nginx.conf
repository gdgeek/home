# __RESOLVER__

# __LB_HTTP_BLOCK__

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # 不缓存 index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 健康检查与版本信息
    location = /health {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /health =404;
    }

    location = /debug-env {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /debug-env.json =404;
    }

    # ============ 反向代理 - API (由 docker-entrypoint.sh 动态生成) ============
    # __API_LOCATIONS__

    # ============ 反向代理 - 统一认证 API (由 docker-entrypoint.sh 动态生成) ============
    # __AUTH_LOCATIONS__

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ============ 自定义 JSON 错误响应 ============
    error_page 502 /502.json;
    location = /502.json {
        internal;
        default_type application/json;
        return 502 '{"error": "Bad Gateway", "status": 502}';
    }

    error_page 503 /503.json;
    location = /503.json {
        internal;
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "status": 503}';
    }

    error_page 504 /504.json;
    location = /504.json {
        internal;
        default_type application/json;
        return 504 '{"error": "Gateway Timeout", "status": 504}';
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
